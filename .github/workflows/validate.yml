name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Project neutrality
        run: python tools/check_project_neutrality.py --root . --json
      - name: Skill package and command help
        run: |
          pytest -q tests/test_skill_package.py
          for script in skills/k8s-admin-diagnostics/scripts/*.py; do python "$script" --help >/dev/null; done
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
