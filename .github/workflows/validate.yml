---
name: validate
"on":
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          COMPARISON_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$COMPARISON_BASE"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          git cat-file -e "${base_sha}^{commit}"

          python tools/classify_changed_paths.py \
            --root . --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Diff hygiene
        env:
          COMPARISON_BASE: ${{ steps.changes.outputs.base_sha }}
        run: git diff --check "${COMPARISON_BASE}...${GITHUB_SHA}"

      - name: GitHub Actions validation (actionlint 1.7.12)
        uses: >-
          docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/validate.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: YAML tooling
        run: python -m pip install yamllint==1.38.0

      - name: YAML validation
        run: yamllint .github/workflows/validate.yml standards-binding.yaml

      - name: Markdown validation
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          '*.md' '**/*.md' '#.git/**'

      - name: Repository secret scan (gitleaks 8.30.1)
        uses: >-
          docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner .

      - name: Project neutrality
        run: python tools/check_project_neutrality.py --root . --json

      - name: Python dependencies
        if: steps.changes.outputs.non_markdown_count != '0'
        run: python -m pip install -r requirements.txt

      - name: Bash tools and Bats
        if: steps.changes.outputs.non_markdown_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bats shfmt
          shell_files=(
            install.sh
            bin/ci-api bin/ci-binary-build
            skills/ci-skills/bin/ci-api skills/ci-skills/bin/ci-binary-build
            skills/ci-skills/lib/core/runtime.bash
            skills/ci-skills/lib/ci/api.bash
            skills/ci-skills/lib/automation/binary_build.bash
            examples/emit-binary-buildconfig.sh
            examples/emit-vcpkg-prereq.sh
          )
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
          shellcheck -x -S style "${shell_files[@]}"
          shfmt -i 2 -d "${shell_files[@]}"
          bats --tap tests/*.bats

      - name: Ruff lint
        if: steps.changes.outputs.non_markdown_count != '0'
        run: ruff check .

      - name: Ruff format
        if: steps.changes.outputs.non_markdown_count != '0'
        run: ruff format --check .

      - name: Isolated installed-package smoke
        if: steps.changes.outputs.non_markdown_count != '0'
        run: pytest -q tests/test_installed_package.py

      - name: Tests
        if: steps.changes.outputs.non_markdown_count != '0'
        run: pytest -q --ignore=tests/test_installed_package.py

      # Unconditional and never allowed to fail: Markdown-only changes can edit
      # the claims this gate backs. Run it after independent code checks so a
      # stale live receipt does not hide package or unit-test failures.
      - name: Live acceptance receipts
        run: >-
          python tools/check_live_acceptance.py
          --root . --json
