---
name: validate
"on":
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq shellcheck
          python -m pip install -r requirements.txt pydoclint==0.10.1 yamllint==1.38.0
          npm install --global markdownlint-cli2@0.23.2
      - name: Check changed source with the local pre-commit gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          ./bless.sh --base "$base_sha"
      - name: Check runner Python style
        run: |
          ruff check ci-skills/bin/gitlab_runner.py ci-skills/lib/python/core/gitlab_runners.py \
            ci-skills/lib/python/core/gitlab_actions.py ci-skills/lib/python/core/catalog.py \
            ci-skills/lib/python/core/report.py tests/python/test_gitlab_runner_lifecycle.py
          ruff format --check ci-skills/bin/gitlab_runner.py ci-skills/lib/python/core/gitlab_runners.py \
            ci-skills/lib/python/core/gitlab_actions.py ci-skills/lib/python/core/catalog.py \
            ci-skills/lib/python/core/report.py tests/python/test_gitlab_runner_lifecycle.py
      - name: Check reStructuredText API docstrings
        run: |
          pydoclint --style=sphinx --skip-checking-short-docstrings=False \
            --skip-checking-private-functions=True \
            --arg-type-hints-in-docstring=False --check-return-types=False \
            --allow-init-docstring=True \
            ci-skills/lib/python/core/gitlab_runners.py \
            ci-skills/lib/python/core/gitlab_actions.py \
            ci-skills/lib/python/core/action.py \
            ci-skills/lib/python/core/gitlab_milestones.py \
            ci-skills/lib/python/core/gitlab_api.py \
            ci-skills/lib/python/core/catalog.py \
            ci-skills/lib/python/core/report.py \
            ci-skills/bin/gitlab_runner.py
          pydoclint --style=sphinx --skip-checking-short-docstrings=False \
            --arg-type-hints-in-docstring=False --check-return-types=False \
            --allow-init-docstring=True \
            ci-skills/lib/python/core/gitlab_runners.py ci-skills/bin/gitlab_runner.py
      - name: Check manifest and runner receipt schema
        run: |
          python tools/render_manifest.py --check
          check-jsonschema --check-metaschema schemas/results/gitlab-runner-tag.schema.json
          check-jsonschema --check-metaschema schemas/results/gitlab-runner-read.schema.json
          check-jsonschema --check-metaschema schemas/results/gitlab-runner-delete.schema.json
          check-jsonschema --schemafile schemas/results/gitlab-runner-tag.schema.json \
            tests/acceptance/runner-tag/*.json
          if compgen -G 'tests/acceptance/runner-lifecycle/*-get.json' > /dev/null; then
            check-jsonschema --schemafile schemas/results/gitlab-runner-read.schema.json \
              tests/acceptance/runner-lifecycle/*-get.json
          fi
          if compgen -G 'tests/acceptance/runner-lifecycle/*-list.json' > /dev/null; then
            check-jsonschema --schemafile schemas/results/gitlab-runner-read.schema.json \
              tests/acceptance/runner-lifecycle/*-list.json
          fi
          if compgen -G 'tests/acceptance/runner-lifecycle/*-delete-*.json' > /dev/null; then
            check-jsonschema --schemafile schemas/results/gitlab-runner-delete.schema.json \
              tests/acceptance/runner-lifecycle/*-delete-*.json
          fi
      - name: Exercise runner command and contract
        run: |
          python -m pytest -q tests/python/test_live_acceptance.py
          python -m pytest -q tests/python/test_gitlab_actions.py \
            tests/python/test_gitlab_runner_recovery.py \
            tests/python/test_gitlab_runner_lifecycle.py \
            tests/python/test_catalog.py \
            tests/python/test_callbacks.py \
            tests/python/test_propositions.py
          bats --tap tests/bash/bless.bats
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
