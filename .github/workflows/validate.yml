---
name: validate
"on":
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          COMPARISON_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$COMPARISON_BASE"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          git cat-file -e "${base_sha}^{commit}"

          python tools/classify_changed_paths.py \
            --root . --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Diff hygiene
        env:
          COMPARISON_BASE: ${{ steps.changes.outputs.base_sha }}
        run: git diff --check "${COMPARISON_BASE}...${GITHUB_SHA}"

      - name: GitHub Actions validation (actionlint 1.7.12)
        uses: >-
          docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/validate.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: YAML tooling
        run: python -m pip install yamllint==1.38.0

      - name: YAML validation
        run: yamllint .github/workflows/validate.yml standards-binding.yaml

      - name: Markdown validation
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          '*.md' '**/*.md' '#.git/**'

      - name: Repository secret scan (gitleaks 8.30.1)
        uses: >-
          docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner .

      - name: Project neutrality
        run: python tools/check_project_neutrality.py --root . --json

      # Unconditional and never allowed to fail: a Markdown-only change can edit
      # the claims this gate exists to back, and a separate workflow would only
      # be advisory because `validate` is the required check. It needs only the
      # standard library, so it runs before the gated dependency install.
      - name: Live acceptance receipts
        run: >-
          python tools/check_live_acceptance.py
          --root . --json

      - name: Python dependencies
        if: steps.changes.outputs.non_markdown_count != '0'
        run: python -m pip install -r requirements.txt

      - name: Ruff lint
        if: steps.changes.outputs.non_markdown_count != '0'
        run: ruff check .

      - name: Ruff format
        if: steps.changes.outputs.non_markdown_count != '0'
        run: ruff format --check .

      - name: Isolated installed-package smoke
        if: steps.changes.outputs.non_markdown_count != '0'
        run: pytest -q tests/test_installed_package.py

      - name: Tests
        if: steps.changes.outputs.non_markdown_count != '0'
        run: pytest -q --ignore=tests/test_installed_package.py
