---
name: validate
"on":
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        if: ${{ always() }}
        id: changes
        shell: bash
        env:
          COMPARISON_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$COMPARISON_BASE"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          git cat-file -e "${base_sha}^{commit}"

          python tools/classify_changed_paths.py \
            --root . --base "$base_sha" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Diff hygiene
        if: ${{ always() }}
        env:
          COMPARISON_BASE: ${{ steps.changes.outputs.base_sha }}
        run: git diff --check "${COMPARISON_BASE}...${GITHUB_SHA}"

      - name: GitHub Actions validation (actionlint 1.7.12)
        if: ${{ always() }}
        uses: >-
          docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/validate.yml

      - uses: actions/setup-python@v5
        if: ${{ always() }}
        with:
          python-version: '3.11'

      - name: YAML tooling
        if: ${{ always() }}
        run: python -m pip install yamllint==1.38.0 -r requirements.txt

      - name: YAML validation
        if: ${{ always() }}
        run: yamllint .github/workflows/validate.yml standards-binding.yaml

      - name: Approved delivery route
        if: ${{ always() }}
        run: python tools/check_delivery_policy.py --root .

      - name: Function documentation contract
        if: ${{ always() }}
        env:
          COMPARISON_BASE: ${{ steps.changes.outputs.base_sha }}
        run: >-
          python tools/check_function_docs.py --root . --base "$COMPARISON_BASE"

      - name: Resolve pinned Standards
        if: ${{ always() }}
        id: standards_pin
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          import yaml

          binding = yaml.safe_load(Path('standards-binding.yaml').read_text())
          source = binding['spec']['source']
          parsed = urlparse(source['repository'])
          repository = parsed.path.strip('/')
          revision = source['revision']
          if (
              parsed.scheme != 'https'
              or parsed.netloc != 'github.com'
              or repository != 'spyroot/standards'
          ):
              raise SystemExit('Standards source must be spyroot/standards')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Standards revision must be an exact commit')
          output_file = os.environ['GITHUB_OUTPUT']
          with open(output_file, 'a', encoding='utf-8') as output:
              output.write(f'revision={revision}\n')
          PY

      - name: Require private Standards CI read access
        id: standards_access
        if: ${{ always() }}
        env:
          STANDARDS_READ_TOKEN: ${{ secrets.STANDARDS_READ_TOKEN }}
        run: |
          if [[ -z "$STANDARDS_READ_TOKEN" ]]; then
            echo '::error::STANDARDS_READ_TOKEN is required'
            exit 1
          fi

      - uses: actions/checkout@v4
        if: >-
          always() &&
          steps.standards_pin.outcome == 'success' &&
          steps.standards_access.outcome == 'success'
        with:
          repository: spyroot/standards
          ref: ${{ steps.standards_pin.outputs.revision }}
          path: .pinned-standards
          token: ${{ secrets.STANDARDS_READ_TOKEN }}
          persist-credentials: false

      - name: Pinned Standards binding
        if: ${{ always() }}
        run: >-
          python tools/check_standards_binding.py
          --root . --standards .pinned-standards

      - name: Markdown validation
        if: ${{ always() }}
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          '*.md' '**/*.md' '#.git/**'

      - name: Repository secret scan (gitleaks 8.30.1)
        if: ${{ always() }}
        uses: >-
          docker://zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner .

      - name: Project neutrality
        if: ${{ always() }}
        run: python tools/check_project_neutrality.py --root . --json

      - name: Bash tools and Bats
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bats shfmt
          shell_files=(
            install.sh
            bin/ci-api bin/ci-binary-build
            skills/ci-skills/bin/ci-api skills/ci-skills/bin/ci-binary-build
            skills/ci-skills/lib/core/runtime.bash
            skills/ci-skills/lib/ci/api.bash
            skills/ci-skills/lib/automation/binary_build.bash
            examples/emit-binary-buildconfig.sh
            examples/emit-vcpkg-prereq.sh
          )
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
          shellcheck -x -S style "${shell_files[@]}"
          shfmt -i 2 -d "${shell_files[@]}"
          bats --tap tests/*.bats

      - name: Ruff lint
        if: ${{ always() }}
        run: ruff check .

      - name: Ruff format
        if: ${{ always() }}
        run: ruff format --check .

      - name: Isolated installed-package smoke
        if: ${{ always() }}
        run: pytest -q tests/test_installed_package.py

      - name: Tests
        if: ${{ always() }}
        run: pytest -q --ignore=tests/test_installed_package.py

      # Unconditional and never allowed to fail: Markdown-only changes can edit
      # the claims this gate backs. Run it after independent code checks so a
      # stale live receipt does not hide package or unit-test failures.
      - name: Live acceptance receipts
        if: ${{ always() }}
        run: >-
          python tools/check_live_acceptance.py
          --root . --json
