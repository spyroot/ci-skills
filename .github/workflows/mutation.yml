---
name: mutation
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI_RUNNER_IMAGE: &ci_runner_image >-
    python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Mutation testing of the modules in pyproject.toml [tool.mutmut]. The job fails when a
  # mutant survives or times out; required-result does not aggregate it.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: *ci_runner_image
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - name: Trust and read back the exact GitHub workspace
        run: |
          git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"
          [[ $(git config --global --get-all safe.directory) == "$GITHUB_WORKSPACE" ]]
          [[ $(git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree) == true ]]
      - name: Install mutation and coverage tools
        run: python -m pip install -r requirements.txt mutmut==2.5.1 coverage==7.10.7
      - name: Report coverage of the mutated modules
        run: |
          mkdir -p reports/raw
          include=$(
            python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(",".join(tomllib.load(handle)["tool"]["mutmut"]["paths_to_mutate"]))
          PY
          )
          python -m coverage run --include="$include" -m pytest -q @tests/python/mutation-targets.txt
          python -m coverage report --show-missing | tee reports/raw/mutation-coverage.txt
      - name: Run mutmut on the selected modules
        run: |
          status=0
          mutmut run --no-progress --simple-output || status=$?
          mutmut results | tee reports/raw/mutation-results.txt
          mutmut junitxml >reports/raw/mutation.xml
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-mutation
          path: reports
