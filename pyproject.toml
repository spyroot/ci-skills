# install.sh copies the skill; this file configures repository checks.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
external = ["DOC"]
# Callback contracts use explicit Optional and Union annotations.
ignore = ["UP007", "UP045"]

[tool.coverage.run]
branch = true
# The 80% target scopes to the shipped skill. tools/ and gates/ are exercised
# by jobs whose suites run outside the unit step, so they cannot join this
# gate without cross-job data merging.
source = ["ci-skills/lib/python", "ci-skills/bin"]

[tool.coverage.report]
# Operator-set merge target: the required unit step fails below this total.
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["ci-skills/lib/python/"]
# Sandbox profile: mutmut runs the suite inside its untracked mutants/ copy,
# where git revision provenance cannot verify. The deselected tests require a
# git-verified checkout, so they are excluded here by this documented profile
# rule (unit-testing contract); they still run in the required CI jobs.
pytest_add_cli_args_test_selection = [
    "tests/python/",
    # The receipt records the checkout's resolved git revision.
    "--deselect",
    "tests/python/test_access_core.py::test_check_access_receipt_records_metadata_and_resolved_sources",
    # Committed receipts are compared against the checkout's git revision.
    "--deselect",
    "tests/python/test_gitlab_actions.py::test_committed_runner_tag_receipts_match_live_contract",
    # The installer refuses an unverified source revision (untracked copy).
    "--deselect",
    "tests/python/test_installed_package.py",
    # The checkout itself cannot report a verified revision when untracked.
    "--deselect",
    "tests/python/test_provenance.py::test_this_checkout_reports_a_verified_revision",
]
# mutmut auto-copies tests/ and pyproject.toml into its sandbox. Everything
# else tests/python reads from the repository root must be listed here or the
# baseline suite fails on missing files before any mutant runs.
also_copy = [
    "ci-skills/SKILL.md",
    "ci-skills/tools.json",
    "ci-skills/benchmarks/",
    "ci-skills/bin/",
    "ci-skills/lib/__init__.py",
    "ci-skills/lib/bash/",
    "ci-skills/references/",
    "ci-skills/schemas/",
    "examples/",
    "gates/",
    "inventory/",
    "schemas/",
    "tools/",
    ".github/workflows/",
    "README.md",
    "standards-binding.yaml",
    "target.toml.template",
]
