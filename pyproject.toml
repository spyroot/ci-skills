[tool.yamlfix]
line_length = 80
explicit_start = false
preserve_quotes = true

[build-system]
requires = ["scikit-build-core>=1.0,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "hidden-gems"
version = "0.1.0"
description = "A nifty library for finding hidden gems such as API keys, secrets, and tokens across credential providers."
readme = "demos/README.md"
requires-python = ">=3.11"
dependencies = ["kubernetes>=36.0.3", "python-dotenv>=1.2.3", "PyYAML>=6.0.3"]

[project.optional-dependencies]
onepassword = ["onepassword>=0.4.1"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.py-api = "py3"
wheel.reproducible = true

[tool.scikit-build.wheel.packages]
"demos/hiddengems" = "demos/hiddengems"

# Settings for Python tools using environment.yml.

[tool.pytest.ini_options]
# The tests import the shared package from src/ without installing it.
pythonpath = ["src"]
testpaths = ["tests"]
# A read-only CI checkout has nowhere useful to keep a cache.
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
# Exclusions apply to paths named on the command line too: the CI gate passes
# an explicit file list from git ls-files.
force-exclude = true

[tool.ruff.format]
# The formatter is not run over the demos tree. It does not only move
# whitespace: it drops redundant parentheses, rewrites single-quoted strings to
# double, and re-indents docstrings. Those files are authored in their own
# style and that style is not a defect.
exclude = [
  "demos/**/*.py",
  # The demo tests, authored alongside those modules in the same style.
  "tests/test_agent_observability_api.py",
  "tests/test_demo_control.py",
  "tests/test_demo_reference_contract.py",
  "tests/test_stagecraft_state.py",
  "tests/test_wizard_prompt.py",
]

# The demos tree is checked for formatting only. Its modules are authored
# examples and the hidden-gems wheel source (see tool.scikit-build above): they
# keep typing's aliases, their own import order, their own quoted forward
# references, and the deliberate `except BaseException` in the Stagecraft
# executor that groups failures and re-raises them. None of it is a defect -
# CPython 3.11 raises no DeprecationWarning for typing.Tuple, gives it no
# __deprecated__ and schedules no removal, and no contract in the pinned
# standards specifies annotation style. These rules only began firing when the
# toolbox moved to ruff 0.16, whose default rule set is far wider than 0.15's;
# environment.yml recorded that default rather than choosing it. Every path
# outside demos/ keeps the full set.
[tool.ruff.lint.per-file-ignores]
"demos/**/*.py" = [
  "UP006",
  "UP035",
  "UP037",
  "UP045",
  "I001",
  "BLE001",
  "PYI059",
  "TRY004",
  "F401",
  "RUF100",
]
