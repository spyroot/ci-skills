# install.sh copies the skill; this file configures repository checks.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
external = ["DOC"]
# Callback contracts use explicit Optional and Union annotations.
ignore = ["UP007", "UP045"]
