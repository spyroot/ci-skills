---
# Adjust default MD013 to 120 line length.
# Exclude original vendor or third-party docs
# ALl dirs are place-holders
config:
  default: true
  MD013:
    line_length: 120
    code_blocks: false
ignores:
  - "docs/vendor/original/**"
  - "docs/vendor/**"
  - "docs/thirdparty/**"
  # Records copied verbatim from the working sessions (docs/README.md, Records): generated text kept as
  # written, so these dated folders are excluded explicitly instead of being reformatted.
  - "docs/brainstorm/2026-10-02/**"
  - "docs/plans/2026-10-04/**"
  - "docs/plans/2026-10-06/**"
  - "docs/reviews/2026-10-04/**"
  - "docs/reviews/2026-10-06/**"
