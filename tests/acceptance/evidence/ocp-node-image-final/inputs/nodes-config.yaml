hosts:
  - hostname: ci-skills-worker-smoke
    rootDeviceHints:
      deviceName: /dev/sda
    interfaces:
      - name: ens3
        macAddress: 02:00:00:10:00:01
      - name: ens4
        macAddress: 02:00:00:10:00:02
    networkConfig:
      interfaces:
        - name: ens3
          type: ethernet
          state: up
          mac-address: 02:00:00:10:00:01
          mtu: 9000
          ipv4:
            enabled: true
            dhcp: true
          ipv6:
            enabled: false
        - name: ens4
          type: ethernet
          state: up
          mac-address: 02:00:00:10:00:02
          mtu: 1500
          ipv4:
            enabled: false
          ipv6:
            enabled: false
