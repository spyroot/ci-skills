# What a live-access receipt must prove before this revision is accepted.
#
# Owned by the operator. Every value here was read back from a real receipt, not
# chosen: run `access_check.py --publication --receipt-out acceptance/receipts/<label>.json`
# on an intended host and the committed receipt is compared against this file by
# `tools/check_live_acceptance.py`, which the validate workflow runs.
#
# Add an [[executors]] block per intended host. A receipt from a host that is
# not declared here is refused, and a declared host with no receipt is refused.

# How old a receipt may be, measured from its own capture time.
max_receipt_age_days = 30

# Every one of these live checks must be present and access_proven.
required_live_checks = ["storage_report", "event_trace", "cilium_status", "ceph_cluster", "gitlab_job"]

# A completed job on the selected GitLab host with readable pipeline, runner,
# and trace data. This is an exact acceptance target, not a skill default.
job_url = "https://gitlab.dcloud.run/hott/isovalent/-/jobs/38883"

# The namespace selected for this repository's Ceph live check. The generic
# skill takes it from --ceph-namespace; no namespace is built into the tool.
ceph_namespace = "openshift-storage"

# Required GitHub checks the publication gate must have read back.
required_checks = ["validate"]

[targets]
github = "github.com/spyroot/ci-skills"
gitlab = "https://gitlab.dcloud.run"

[targets.kubernetes]
context = "ww-cai-verified"
server = "https://api.ww-cai-cisco-live.dcloud.local:6443"

[[executors]]
label = "operator-laptop"
host = "mac.lan"

[executors.identities]
github = "spyroot"
gitlab = "spyroot"
kubernetes = "kube:admin"

